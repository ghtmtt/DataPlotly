
name: Transifex 🗺

on:
  push:
    branches: [master]
    tags:
      - '*'
    paths:
      - 'DataPlotly/**/*.py'
      - 'DataPlotly/**/*.ui'
      - 'docs/**'
      - '.tx/config'
      - '.github/workflows/transifex.yml'

jobs:
  push-plugin-translations:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci

      - name: Push plugin translations
        run: qgis-plugin-ci push-translation ${{ secrets.TRANSIFEX_TOKEN }}

  push-documentation-translations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install documentation dependencies
        run: pip install -r requirements/docs.txt

      - name: Install sphinx-intl
        run: pip install sphinx-intl

      - name: Extract documentation strings
        run: sphinx-build -b gettext docs docs/target/gettext

      - name: Update English source catalogs
        working-directory: docs
        run: sphinx-intl update -p target/gettext -l en

      - name: Push documentation sources to Transifex
        uses: transifex/cli-action@v2
        with:
          token: ${{ secrets.TRANSIFEX_TOKEN }}
          args: push -s
